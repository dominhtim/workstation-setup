---
# Provisions a machine, then applies the dotfiles from the separate
# `dotfiles` repo (github.com/dominhtim/dotfiles) via chezmoi.
# Safe to re-run: every task is idempotent (Ansible's `changed`/`ok` states
# handle that natively, no `install.sh`-style manual "does it exist" checks
# needed for most of this).
#
# Run with: ansible-playbook -K ansible/playbook.yml
# -K prompts for a sudo password. Only actually needed the very first time:
# the first task below grants this user passwordless sudo permanently, so
# every task after it in this same run — and every run after this one —
# needs no password at all. bootstrap.sh detects this automatically and
# drops -K once it's in place.

- name: Bootstrap dev workstation (packages, zsh, chezmoi-managed dotfiles)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Change these if you fork this repo for someone else, or use a different GitHub account.
    git_name: "dominhtim"
    git_email: "dominhtim@gmail.com"
    dotfiles_repo: "dominhtim/dotfiles"
    chezmoi_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    projects_dir: "{{ ansible_facts['env']['HOME'] }}/projects"
    # Add/remove repos here — cloned once into ~/projects, never touched again
    # after that (these are your working repos, not something to auto-sync).
    project_repos:
      - git@github.com:dominhtim/TestProject.git
      - git@github.com:dominhtim/discord-bot.git
    # Debian and Ubuntu ship the same Compose v2 Go plugin under different
    # binary names, and each lacks the other's: Debian 13 has
    # `docker-compose` 2.26 (its v1 python package is long gone), Ubuntu has
    # `docker-compose-v2` and no `docker-compose` at all.
    compose_package: "{{ 'docker-compose' if ansible_facts['distribution'] == 'Debian' else 'docker-compose-v2' }}"
    # Neovim needs pinning separately from the package list below. The
    # dotfiles' LSP config calls vim.lsp.config() and vim.lsp.enable(),
    # both of which landed in 0.11, and mason-lspconfig v2 calls
    # vim.lsp.enable() itself — so on an older Neovim the entire LSP layer
    # dies at startup with "attempt to call field 'config' (a nil value)".
    # That's a floor, not a preference.
    nvim_min_version: "0.11"
    # Pinned rather than tracking 'latest': every machine sharing these
    # dotfiles should run the same editor, and a rolling latest would mean
    # two boxes provisioned a month apart quietly differ.
    nvim_version: "v0.11.6"
    nvim_arch: "{{ 'x86_64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    # One list, used by both the preflight check and the install task below,
    # so the two can never drift apart.
    base_packages:
      - git
      - zsh
      - curl
      - tmux
      - neovim
      - fzf
      - ripgrep
      - unzip
      - xclip
      - openssh-client
      - nodejs
      - npm
      - build-essential
      - docker.io
      - "{{ compose_package }}"
      - docker-buildx
      - gh

  tasks:
    # --- Preflight -----------------------------------------------------
    # Everything here runs before the first task that changes anything, so
    # a machine this playbook can't finish on is left exactly as it was
    # rather than half-provisioned. Checks that have to happen even earlier
    # than Ansible (sudo, a real terminal, the controller's Python version)
    # live in bootstrap.sh instead — Ansible can't make them, it needs all
    # three to already hold before its own first task runs.

    # `package` fails as a single unit: one name missing from the archives
    # takes the whole install task with it, and apt's error doesn't make it
    # obvious which name was at fault. Package names aren't as portable
    # across Debian and Ubuntu as they look — see `compose_package` above,
    # where the two ship the same software under names neither of the other
    # has. Probing first turns that into a named list up front instead of a
    # wall of apt output later.
    # `apt-get -s install` rather than `apt-cache show`: show exits 0 for a
    # purely virtual name with no installation candidate (on Ubuntu,
    # `docker-compose` is such a name, provided by docker-compose-v2), so it
    # would wave through things that can't actually be installed. The
    # simulated install resolves providers properly and fails on anything
    # apt couldn't really put on the disk. It needs no root.
    - name: "Preflight: check each base package is actually installable"
      ansible.builtin.command: "apt-get -s install {{ item }}"
      register: pkg_probe
      changed_when: false
      failed_when: false
      loop: "{{ base_packages }}"
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: "Preflight: stop if any base package is unavailable"
      vars:
        missing_packages: "{{ pkg_probe.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"
      ansible.builtin.assert:
        that: missing_packages | length == 0
        fail_msg: >-
          Not in this distro's archives: {{ missing_packages | join(', ') }}.
          Nothing has been changed on this machine yet. Check whether this
          distro calls them something else, add the repo that provides
          them, or drop them from `base_packages` at the top of this
          playbook and install them by hand — and run `sudo apt update`
          first if you think the package index is just stale.
        success_msg: "All {{ base_packages | length }} base packages are available."
      when: ansible_facts['pkg_mgr'] == 'apt'
    # --- End preflight -------------------------------------------------

    - name: Ensure /etc/sudoers.d exists
      ansible.builtin.file:
        path: /etc/sudoers.d
        state: directory
        owner: root
        group: root
        mode: "0750"
      become: true

    # This is the one task in the whole playbook that a fresh machine can't
    # get around needing a real, working sudo credential for — nothing can
    # grant itself root from nothing. Everything after it, though, runs
    # passwordless, in this run and every run after.
    - name: Grant this user passwordless sudo (one-time; every task after this is then passwordless)
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ ansible_facts['user_id'] }}-nopasswd"
        content: "{{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      become: true

    - name: Install base packages
      ansible.builtin.package:
        name: "{{ base_packages }}"
        state: present
      become: true

    # --- Neovim version floor --------------------------------------------
    # `neovim` is in base_packages above, but a distro archive is only ever
    # as new as the distro: Ubuntu 26.04 ships 0.11.6 while Debian 13 is
    # still on 0.10.x. Since the dotfiles are shared across every machine
    # and their nvim config is 0.11-only (see nvim_min_version above), a
    # box that installed the older one isn't merely behind — its LSP setup
    # throws three errors before you get a prompt. So: keep whatever apt
    # gave us when it's new enough, and lay an upstream build over the top
    # when it isn't.
    #
    # apt's copy is deliberately left installed rather than removed. It
    # still owns the vi/vim alternatives, costs nothing sitting there, and
    # /usr/local/bin precedes /usr/bin on both Debian and Ubuntu — so the
    # symlink below simply wins on PATH, and undoing all of this is one
    # `rm /usr/local/bin/nvim` away.
    - name: Check which Neovim is on PATH
      ansible.builtin.command: nvim --version
      register: nvim_version_check
      changed_when: false
      failed_when: false

    - name: Work out which Neovim version that is
      ansible.builtin.set_fact:
        # "NVIM v0.10.4" -> "0.10.4". Dev builds append "-dev-1234+abc123",
        # which the version test can't parse, so that's trimmed too. A
        # missing/unrunnable nvim becomes "0", which fails the floor and
        # takes the install path — the right answer either way.
        nvim_installed_version: >-
          {{ (nvim_version_check.stdout_lines[0] | regex_replace('^NVIM v', '') | regex_replace('[-+].*$', ''))
             if nvim_version_check.rc == 0 and nvim_version_check.stdout_lines | length > 0
             else '0' }}

    - name: Install an upstream Neovim when the distro's is below the floor
      when: nvim_installed_version is not version(nvim_min_version, '>=')
      become: true
      block:
        # Version-stamped directory, so bumping nvim_version installs
        # alongside rather than half-overwriting the previous unpack (the
        # tarball's own top-level directory name has no version in it).
        - name: Create the install directory for the upstream Neovim
          ansible.builtin.file:
            path: "/opt/nvim-{{ nvim_version }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        # No checksum: upstream publishes no shasum asset for these
        # tarballs, same as the chezmoi binary further down. HTTPS to
        # GitHub's release CDN is the integrity guarantee in both cases.
        - name: Download and unpack the upstream Neovim
          ansible.builtin.unarchive:
            src: "https://github.com/neovim/neovim/releases/download/{{ nvim_version }}/nvim-linux-{{ nvim_arch }}.tar.gz"
            dest: "/opt/nvim-{{ nvim_version }}"
            remote_src: true
            extra_opts: ["--strip-components=1"]
            creates: "/opt/nvim-{{ nvim_version }}/bin/nvim"

        - name: Put the upstream Neovim ahead of the distro's on PATH
          ansible.builtin.file:
            src: "/opt/nvim-{{ nvim_version }}/bin/nvim"
            dest: /usr/local/bin/nvim
            state: link

        - name: Note that Neovim was replaced
          ansible.builtin.debug:
            msg: >-
              This distro's Neovim is {{ nvim_installed_version }}, below the
              {{ nvim_min_version }} the dotfiles' LSP config needs, so
              {{ nvim_version }} was installed to /opt and linked into
              /usr/local/bin. If this machine had already opened nvim on the
              old version, run ':Lazy sync' once to rebuild the plugin state.

    - name: Add this user to the docker group (lets you run docker without sudo)
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: docker
        append: true
      become: true

    # Skipped rather than failed where there's no systemd to talk to —
    # Debian/Ubuntu under WSL without `systemd=true` in /etc/wsl.conf being
    # the case that actually turns up. Everything else here still applies;
    # only starting the daemon has to be done by hand.
    - name: Ensure the docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      become: true
      when: ansible_facts['service_mgr'] == 'systemd'

    - name: Note that the docker service was left alone (no systemd on this machine)
      ansible.builtin.debug:
        msg: >-
          Init system is '{{ ansible_facts['service_mgr'] }}', not systemd, so
          docker wasn't enabled or started. Start it yourself
          ('sudo service docker start'), or under WSL put 'systemd=true' in
          the [boot] section of /etc/wsl.conf and restart the distro.
      when: ansible_facts['service_mgr'] != 'systemd'

    # --- SSH key for GitHub, done early on purpose -----------------------
    # This used to happen right before the dotfiles clone, which meant you
    # only found out you needed to add a key to GitHub after everything
    # else had already finished — a hard failure, right at the end, with
    # no way to continue the same run. Doing it here instead means you get
    # the key to paste in within the first few seconds, with the slower
    # steps below (oh-my-zsh, plugin clones, downloading chezmoi) running
    # while you go add it. There's still a checkpoint right before the
    # actual clone (search for "Pause" below) in case you need more time
    # than that.
    #
    # No token or password is ever stored anywhere in this repo. The
    # private key is generated on the machine and never leaves it; the
    # only thing that needs to go anywhere is the public key, which isn't
    # secret by definition. Adding it to your GitHub account is the one
    # step that genuinely can't be automated — GitHub requires that to
    # happen through an authenticated browser session as a deliberate
    # security boundary, not a gap in this playbook.
    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
        state: directory
        mode: "0700"

    - name: Check for an existing SSH key
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519"
      register: ssh_key

    - name: Generate an SSH key for GitHub (ed25519, no passphrase — protected by this machine's disk like any other local key)
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -f {{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519
        -N "" -C "{{ ansible_facts['user_id'] }}@{{ ansible_facts['hostname'] }}"
      when: not ssh_key.stat.exists
      changed_when: true

    - name: Fetch GitHub's SSH host key
      ansible.builtin.command: ssh-keyscan -t ed25519 github.com
      register: github_hostkey
      changed_when: false
      failed_when: false
      retries: 3
      delay: 2
      until: github_hostkey.rc == 0 and github_hostkey.stdout | length > 0

    - name: Add GitHub's host key to known_hosts (avoids an interactive "authenticity of host" prompt on first connect)
      ansible.builtin.known_hosts:
        name: github.com
        key: "{{ github_hostkey.stdout }}"
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts"
      when: github_hostkey.rc == 0 and github_hostkey.stdout | length > 0

    - name: Read the public key so it can be displayed
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519.pub"
      register: github_pubkey

    - name: Print the SSH public key now, right at the start, so there's time to add it before it's actually needed
      ansible.builtin.debug:
        msg:
          - "SSH key ready. Add it to GitHub now if you haven't already (github.com/settings/keys -> New SSH key):"
          - "{{ github_pubkey.content | b64decode }}"
          - "The rest of the setup runs while you do that — there's a checkpoint before the dotfiles clone if you need more time."

    - name: Check whether oh-my-zsh is already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
      register: omz_dir

    - name: Clone oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
        version: master   # intentionally tracks upstream tip, not pinned — this is a rolling theme/plugin install
        depth: 1
      when: not omz_dir.stat.exists

    - name: Clone/update powerlevel10k theme
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/themes/powerlevel10k"
        version: master
        depth: 1
        update: true

    - name: Clone/update zsh-autosuggestions plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        version: master
        depth: 1
        update: true

    - name: Clone/update zsh-syntax-highlighting plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
        version: master
        depth: 1
        update: true

    - name: Set zsh as the default shell
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /usr/bin/zsh
      become: true

    - name: Check whether chezmoi is already installed
      ansible.builtin.command: command -v chezmoi
      register: chezmoi_check
      failed_when: false
      changed_when: false

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Install chezmoi (downloads the plain binary straight from the GitHub release, no curl|sh installer script)
      ansible.builtin.get_url:
        url: "https://github.com/twpayne/chezmoi/releases/latest/download/chezmoi-linux-{{ chezmoi_arch }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi"
        mode: "0755"
      when: chezmoi_check.rc != 0

    - name: Ensure ~/.config/chezmoi exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/chezmoi"
        state: directory
        mode: "0700"

    # Pre-seeding chezmoi's own config with the identity data means `chezmoi
    # init` below never has to prompt interactively — which matters because
    # Ansible tasks don't have a real TTY to prompt through anyway.
    - name: Seed chezmoi's config with git identity (so its own init prompt is skipped)
      ansible.builtin.template:
        src: chezmoi.toml.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/chezmoi/chezmoi.toml"
        mode: "0600"

    - name: Check whether the dotfiles repo has already been cloned by chezmoi
      ansible.builtin.stat:
        # Checking for .git specifically, not just the parent directory —
        # a clone that failed partway through (e.g. an auth prompt on a
        # private repo) can still leave the parent directory behind without
        # a real git checkout inside it.
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi/.git"
      register: chezmoi_git_before

    - name: Check whether a stale/incomplete chezmoi source directory exists
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi"
      register: chezmoi_src_dir

    - name: Remove incomplete chezmoi source directory left by a previously-failed clone
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi"
        state: absent
      when: chezmoi_src_dir.stat.exists and not chezmoi_git_before.stat.exists

    - name: Check the existing source repo's remote URL, if a valid clone exists
      ansible.builtin.command: "git -C {{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi remote get-url origin"  # noqa: command-instead-of-module
      register: chezmoi_remote
      changed_when: false
      failed_when: false
      when: chezmoi_git_before.stat.exists

    - name: Remove the source directory if it's still using the old HTTPS remote (predates switching to SSH)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi"
        state: absent
      when: chezmoi_git_before.stat.exists and chezmoi_remote.stdout is defined and chezmoi_remote.stdout.startswith('https://')

    # Re-checked after the self-healing above, rather than reusing
    # chezmoi_git_before — that fact would be stale (still say "exists")
    # even immediately after a task just deleted the directory.
    - name: Re-check whether a valid clone still exists after any self-healing above
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi/.git"
      register: chezmoi_git

    # Only fires when a clone is actually about to happen (fresh machine,
    # a previously broken clone, or one just cleared for using the wrong
    # remote above) — once the dotfiles are cloned successfully, this and
    # everything above it about SSH is skipped on every future run.
    - name: Pause here if the SSH key might not be added to GitHub yet
      ansible.builtin.pause:
        prompt: >-
          About to clone the dotfiles repo over SSH. If you haven't added the
          key printed near the start of this run to GitHub yet
          (github.com/settings/keys), do that now. Press Enter once it's
          done to continue
      when: not chezmoi_git.stat.exists

    - name: Clone the dotfiles repo over SSH (first run only — chezmoi init doesn't pull on repeat runs)
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi init --ssh {{ dotfiles_repo }}"
      when: not chezmoi_git.stat.exists
      changed_when: true

    # `chezmoi update` is pull + apply in one. It's split here because the
    # check between the two halves is only meaningful against the freshly
    # pulled target: a file that looks hand-edited against yesterday's
    # source can be perfectly in step with what was just pushed, and
    # checking before the pull blocks on a divergence the pull itself
    # resolves. That is not hypothetical — it is exactly what happened
    # when the fix for a hand-edited .gitignore_global was sitting in the
    # dotfiles repo, unpulled, while this check refused to let the pull
    # happen.
    - name: Pull the latest dotfiles (apply comes after the check below)
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi git -- pull --ff-only"
      register: chezmoi_pull
      changed_when: "'Already up to date' not in chezmoi_pull.stdout"

    # chezmoi apply asks before overwriting a file that changed since
    # chezmoi last wrote it. This task has no TTY for the question, so the
    # run dies with "could not open a new TTY: open /dev/tty: no such
    # device or address" — which names the file only in passing and says
    # nothing about what to do. Asking chezmoi first turns that into a
    # message about the actual problem. `chezmoi status` puts a non-blank
    # character in column 1 for exactly this case (changed since chezmoi
    # wrote it); column 2 is just "differs from target", which is every
    # file waiting to be applied and is none of our business.
    - name: Check for dotfiles edited by hand since chezmoi last wrote them
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi status"
      register: chezmoi_state
      changed_when: false

    - name: Stop if a hand-edited dotfile would have to be overwritten
      vars:
        hand_edited: "{{ chezmoi_state.stdout_lines | reject('match', '^ ') | map('regex_replace', '^..\\s*', '') | list }}"
      ansible.builtin.assert:
        that: hand_edited | length == 0
        fail_msg: >-
          Edited by hand since chezmoi last wrote them:
          {{ hand_edited | join(', ') }}. The apply below would prompt before
          overwriting, and this task has no terminal to answer through. Keep the
          edit with `chezmoi add <file>` (that pulls it into the dotfiles repo —
          commit and push it there), or throw it away with
          `chezmoi apply --force <file>`. Then re-run this.
        success_msg: "No hand-edited dotfiles in the way."

    - name: Apply the dotfiles (safe to run every time — a no-op when nothing differs)
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi apply"
      changed_when: chezmoi_state.stdout | length > 0

    # Placed after the dotfiles clone on purpose: a successful SSH clone
    # above already proves the SSH key is registered with GitHub, so
    # there's no need to repeat the pause/reminder checkpoint here too.
    - name: Ensure ~/projects exists
      ansible.builtin.file:
        path: "{{ projects_dir }}"
        state: directory
        mode: "0755"

    - name: Clone project repos (first run only — these are your working repos, left alone after that, not auto-synced)
      ansible.builtin.git:  # noqa: latest[git] — these are active dev repos, pinning to a frozen commit would be wrong here, not safer
        repo: "{{ item }}"
        dest: "{{ projects_dir }}/{{ item | basename | regex_replace('\\.git$', '') }}"
        version: HEAD
        update: false
      loop: "{{ project_repos }}"

    - name: Ensure ~/.zshrc.local exists (untracked, machine-only escape hatch)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc.local"
        state: touch
        mode: "0644"
        access_time: preserve
        modification_time: preserve

- name: Post-run summary
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print next steps
      ansible.builtin.debug:
        msg:
          - "Done."
          - "Next steps:"
          - "  1. Log out and back in — needed for the docker group to take effect (you'll get 'permission denied' on the docker socket until you do) and for the shell change to fully take. 'exec zsh' reloads the shell alone, but won't pick up the new group."
          - "  2. Run 'p10k configure' to set up the prompt"
          - "  3. Open nvim once to let lazy.nvim install all plugins automatically"
          - "  4. To edit a dotfile going forward: 'chezmoi edit ~/.zshrc' then 'chezmoi apply'"
