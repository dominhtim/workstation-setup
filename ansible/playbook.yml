---
# Provisions a machine, then applies github.com/dominhtim/dotfiles via chezmoi.
# Run with: ansible-playbook -K ansible/playbook.yml   (or ../bootstrap.sh)

- name: Bootstrap dev workstation (packages, zsh, chezmoi-managed dotfiles)
  hosts: localhost
  connection: local
  gather_facts: true

  vars:
    # Change these if you fork this repo or use a different GitHub account.
    git_name: "dominhtim"
    git_email: "dominhtim@gmail.com"
    dotfiles_repo: "dominhtim/dotfiles"
    chezmoi_arch: "{{ 'amd64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    projects_dir: "{{ ansible_facts['env']['HOME'] }}/projects"
    # Cloned once into ~/projects, never updated after that.
    project_repos:
      - git@github.com:dominhtim/TestProject.git
      - git@github.com:dominhtim/discord-bot.git
    # Debian and Ubuntu package Compose v2 under different names, and
    # neither distro has the other's.
    compose_package: "{{ 'docker-compose' if ansible_facts['distribution'] == 'Debian' else 'docker-compose-v2' }}"
    # A hard floor, not a preference: the dotfiles' LSP config is 0.11-only.
    nvim_min_version: "0.11"
    # Pinned so machines provisioned months apart run the same editor.
    nvim_version: "v0.11.6"
    nvim_arch: "{{ 'x86_64' if ansible_facts['architecture'] == 'x86_64' else 'arm64' }}"
    # Used by both the preflight probe and the install task, so they can't drift.
    base_packages:
      - git
      - zsh
      - curl
      - tmux
      - neovim
      - fzf
      - ripgrep
      - unzip
      - xclip
      - openssh-client
      - nodejs
      - npm
      - build-essential
      - docker.io
      - "{{ compose_package }}"
      - docker-buildx
      - gh

  tasks:
    # --- Preflight -----------------------------------------------------
    # Runs before anything mutates the machine. Earlier checks are in bootstrap.sh.

    # A simulated install, not `apt-cache show`: it resolves virtual names
    # and fails on anything apt couldn't really put on the disk. Needs no root.
    - name: "Preflight: check each base package is actually installable"
      ansible.builtin.command: "apt-get -s install {{ item }}"
      register: pkg_probe
      changed_when: false
      failed_when: false
      loop: "{{ base_packages }}"
      when: ansible_facts['pkg_mgr'] == 'apt'

    - name: "Preflight: stop if any base package is unavailable"
      vars:
        missing_packages: "{{ pkg_probe.results | selectattr('rc', 'defined') | selectattr('rc', 'ne', 0) | map(attribute='item') | list }}"
      ansible.builtin.assert:
        that: missing_packages | length == 0
        fail_msg: >-
          Not in this distro's archives: {{ missing_packages | join(', ') }}.
          Nothing has been changed on this machine yet. Check whether this
          distro calls them something else, add the repo that provides
          them, or drop them from `base_packages` at the top of this
          playbook and install them by hand — and run `sudo apt update`
          first if you think the package index is just stale.
        success_msg: "All {{ base_packages | length }} base packages are available."
      when: ansible_facts['pkg_mgr'] == 'apt'
    # --- End preflight -------------------------------------------------

    - name: Ensure /etc/sudoers.d exists
      ansible.builtin.file:
        path: /etc/sudoers.d
        state: directory
        owner: root
        group: root
        mode: "0750"
      become: true

    # The only task needing a real sudo credential; everything after it,
    # here and on every future run, is passwordless.
    - name: Grant this user passwordless sudo (one-time; every task after this is then passwordless)
      ansible.builtin.copy:
        dest: "/etc/sudoers.d/90-{{ ansible_facts['user_id'] }}-nopasswd"
        content: "{{ ansible_facts['user_id'] }} ALL=(ALL) NOPASSWD: ALL\n"
        owner: root
        group: root
        mode: "0440"
        validate: "visudo -cf %s"
      become: true

    - name: Install base packages
      ansible.builtin.package:
        name: "{{ base_packages }}"
        state: present
      become: true

    # --- Neovim version floor --------------------------------------------
    # Keep apt's nvim when it clears nvim_min_version, otherwise lay an
    # upstream build over it on PATH. apt's copy is left installed.
    - name: Check which Neovim is on PATH
      ansible.builtin.command: nvim --version
      register: nvim_version_check
      changed_when: false
      failed_when: false

    - name: Work out which Neovim version that is
      ansible.builtin.set_fact:
        # "NVIM v0.10.4" -> "0.10.4", trimming any "-dev-1234+abc" suffix.
        # A missing nvim becomes "0", which fails the floor and installs.
        nvim_installed_version: >-
          {{ (nvim_version_check.stdout_lines[0] | regex_replace('^NVIM v', '') | regex_replace('[-+].*$', ''))
             if nvim_version_check.rc == 0 and nvim_version_check.stdout_lines | length > 0
             else '0' }}

    - name: Install an upstream Neovim when the distro's is below the floor
      when: nvim_installed_version is not version(nvim_min_version, '>=')
      become: true
      block:
        # Version-stamped so a bump installs alongside the previous unpack
        # rather than half-overwriting it.
        - name: Create the install directory for the upstream Neovim
          ansible.builtin.file:
            path: "/opt/nvim-{{ nvim_version }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        # No checksum: upstream publishes no shasum asset for these tarballs.
        # HTTPS to GitHub's release CDN is the integrity guarantee.
        - name: Download and unpack the upstream Neovim
          ansible.builtin.unarchive:
            src: "https://github.com/neovim/neovim/releases/download/{{ nvim_version }}/nvim-linux-{{ nvim_arch }}.tar.gz"
            dest: "/opt/nvim-{{ nvim_version }}"
            remote_src: true
            extra_opts: ["--strip-components=1"]
            creates: "/opt/nvim-{{ nvim_version }}/bin/nvim"

        - name: Put the upstream Neovim ahead of the distro's on PATH
          ansible.builtin.file:
            src: "/opt/nvim-{{ nvim_version }}/bin/nvim"
            dest: /usr/local/bin/nvim
            state: link

        - name: Note that Neovim was replaced
          ansible.builtin.debug:
            msg: >-
              This distro's Neovim is {{ nvim_installed_version }}, below the
              {{ nvim_min_version }} the dotfiles' LSP config needs, so
              {{ nvim_version }} was installed to /opt and linked into
              /usr/local/bin. If this machine had already opened nvim on the
              old version, run ':Lazy sync' once to rebuild the plugin state.

    - name: Add this user to the docker group (lets you run docker without sudo)
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        groups: docker
        append: true
      become: true

    # Skipped, not failed, without systemd — WSL without `systemd=true`
    # in /etc/wsl.conf is the case that turns up.
    - name: Ensure the docker service is enabled and running
      ansible.builtin.systemd:
        name: docker
        enabled: true
        state: started
      become: true
      when: ansible_facts['service_mgr'] == 'systemd'

    - name: Note that the docker service was left alone (no systemd on this machine)
      ansible.builtin.debug:
        msg: >-
          Init system is '{{ ansible_facts['service_mgr'] }}', not systemd, so
          docker wasn't enabled or started. Start it yourself
          ('sudo service docker start'), or under WSL put 'systemd=true' in
          the [boot] section of /etc/wsl.conf and restart the distro.
      when: ansible_facts['service_mgr'] != 'systemd'

    # --- SSH key for GitHub ----------------------------------------------
    # Deliberately early: the key is printed within seconds, so it can be
    # added to GitHub while the slow steps below run. See CLAUDE.md.
    - name: Ensure ~/.ssh exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
        state: directory
        mode: "0700"

    - name: Check for an existing SSH key
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519"
      register: ssh_key

    - name: Generate an SSH key for GitHub (ed25519, no passphrase — protected by this machine's disk like any other local key)
      ansible.builtin.command: >
        ssh-keygen -t ed25519 -f {{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519
        -N "" -C "{{ ansible_facts['user_id'] }}@{{ ansible_facts['hostname'] }}"
      when: not ssh_key.stat.exists
      changed_when: true

    - name: Fetch GitHub's SSH host key
      ansible.builtin.command: ssh-keyscan -t ed25519 github.com
      register: github_hostkey
      changed_when: false
      failed_when: false
      retries: 3
      delay: 2
      # Retry until a real key line arrives: the banner is written to stdout
      # even when no key comes back, so a length check would accept that.
      until: github_hostkey.rc == 0 and github_hostkey.stdout_lines | reject('match', '^#') | list | length > 0

    # ssh-keyscan writes its banner to stdout, not stderr. Including it
    # here makes known_hosts grow by two lines per run — see CLAUDE.md.
    - name: Keep just the key line from ssh-keyscan's output
      ansible.builtin.set_fact:
        github_hostkey_line: "{{ github_hostkey.stdout_lines | reject('match', '^#') | first | default('') }}"

    - name: Add GitHub's host key to known_hosts (avoids an interactive "authenticity of host" prompt on first connect)
      ansible.builtin.known_hosts:
        name: github.com
        key: "{{ github_hostkey_line }}"
        path: "{{ ansible_facts['env']['HOME'] }}/.ssh/known_hosts"
      when: github_hostkey_line | length > 0

    - name: Read the public key so it can be displayed
      ansible.builtin.slurp:
        src: "{{ ansible_facts['env']['HOME'] }}/.ssh/id_ed25519.pub"
      register: github_pubkey

    - name: Print the SSH public key now, right at the start, so there's time to add it before it's actually needed
      ansible.builtin.debug:
        msg:
          - "SSH key ready. Add it to GitHub now if you haven't already (github.com/settings/keys -> New SSH key):"
          - "{{ github_pubkey.content | b64decode }}"
          - "The rest of the setup runs while you do that — there's a checkpoint before the dotfiles clone if you need more time."

    - name: Check whether oh-my-zsh is already installed
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
      register: omz_dir

    - name: Clone oh-my-zsh
      ansible.builtin.git:
        repo: https://github.com/ohmyzsh/ohmyzsh.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh"
        version: master   # rolling, intentionally unpinned
        depth: 1
      when: not omz_dir.stat.exists

    - name: Clone/update powerlevel10k theme
      ansible.builtin.git:
        repo: https://github.com/romkatv/powerlevel10k.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/themes/powerlevel10k"
        version: master
        depth: 1
        update: true

    - name: Clone/update zsh-autosuggestions plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-autosuggestions.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-autosuggestions"
        version: master
        depth: 1
        update: true

    - name: Clone/update zsh-syntax-highlighting plugin
      ansible.builtin.git:
        repo: https://github.com/zsh-users/zsh-syntax-highlighting.git
        dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting"
        version: master
        depth: 1
        update: true

    - name: Set zsh as the default shell
      ansible.builtin.user:
        name: "{{ ansible_facts['user_id'] }}"
        shell: /usr/bin/zsh
      become: true

    - name: Check whether chezmoi is already installed
      ansible.builtin.command: command -v chezmoi
      register: chezmoi_check
      failed_when: false
      changed_when: false

    - name: Ensure ~/.local/bin exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/bin"
        state: directory
        mode: "0755"

    - name: Install chezmoi (downloads the plain binary straight from the GitHub release, no curl|sh installer script)
      ansible.builtin.get_url:
        url: "https://github.com/twpayne/chezmoi/releases/latest/download/chezmoi-linux-{{ chezmoi_arch }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi"
        mode: "0755"
      when: chezmoi_check.rc != 0

    - name: Ensure ~/.config/chezmoi exists
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.config/chezmoi"
        state: directory
        mode: "0700"

    # Ansible tasks have no TTY, so chezmoi init's own prompt must never fire.
    - name: Seed chezmoi's config with git identity (so its own init prompt is skipped)
      ansible.builtin.template:
        src: chezmoi.toml.j2
        dest: "{{ ansible_facts['env']['HOME'] }}/.config/chezmoi/chezmoi.toml"
        mode: "0600"

    - name: Check whether the dotfiles repo has already been cloned by chezmoi
      ansible.builtin.stat:
        # .git specifically: a clone that failed partway leaves the parent
        # directory behind with no checkout inside it.
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi/.git"
      register: chezmoi_git_before

    - name: Check whether a stale/incomplete chezmoi source directory exists
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi"
      register: chezmoi_src_dir

    - name: Remove incomplete chezmoi source directory left by a previously-failed clone
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi"
        state: absent
      when: chezmoi_src_dir.stat.exists and not chezmoi_git_before.stat.exists

    - name: Check the existing source repo's remote URL, if a valid clone exists
      ansible.builtin.command: "git -C {{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi remote get-url origin"  # noqa: command-instead-of-module
      register: chezmoi_remote
      changed_when: false
      failed_when: false
      when: chezmoi_git_before.stat.exists

    - name: Remove the source directory if it's still using the old HTTPS remote (predates switching to SSH)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi"
        state: absent
      when: chezmoi_git_before.stat.exists and chezmoi_remote.stdout is defined and chezmoi_remote.stdout.startswith('https://')

    # chezmoi_git_before is stale after the self-healing above — it would
    # still say "exists" for a directory just deleted.
    - name: Re-check whether a valid clone still exists after any self-healing above
      ansible.builtin.stat:
        path: "{{ ansible_facts['env']['HOME'] }}/.local/share/chezmoi/.git"
      register: chezmoi_git

    # Only fires when a clone is about to happen; skipped on every run after.
    - name: Pause here if the SSH key might not be added to GitHub yet
      ansible.builtin.pause:
        prompt: >-
          About to clone the dotfiles repo over SSH. If you haven't added the
          key printed near the start of this run to GitHub yet
          (github.com/settings/keys), do that now. Press Enter once it's
          done to continue
      when: not chezmoi_git.stat.exists

    - name: Clone the dotfiles repo over SSH (first run only — chezmoi init doesn't pull on repeat runs)
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi init --ssh {{ dotfiles_repo }}"
      when: not chezmoi_git.stat.exists
      changed_when: true

    # `chezmoi update` is pull + apply in one, split here because the check
    # between them is only meaningful against the freshly pulled target.
    - name: Pull the latest dotfiles (apply comes after the check below)
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi git -- pull --ff-only"
      register: chezmoi_pull
      changed_when: "'Already up to date' not in chezmoi_pull.stdout"

    # Column 1 non-blank means "changed since chezmoi wrote it", which is
    # what apply would prompt about. Column 2 is every pending file.
    - name: Check for dotfiles edited by hand since chezmoi last wrote them
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi status"
      register: chezmoi_state
      changed_when: false

    - name: Stop if a hand-edited dotfile would have to be overwritten
      vars:
        hand_edited: "{{ chezmoi_state.stdout_lines | reject('match', '^ ') | map('regex_replace', '^..\\s*', '') | list }}"
      ansible.builtin.assert:
        that: hand_edited | length == 0
        fail_msg: >-
          Edited by hand since chezmoi last wrote them:
          {{ hand_edited | join(', ') }}. The apply below would prompt before
          overwriting, and this task has no terminal to answer through. Keep the
          edit with `chezmoi add <file>` (that pulls it into the dotfiles repo —
          commit and push it there), or throw it away with
          `chezmoi apply --force <file>`. Then re-run this.
        success_msg: "No hand-edited dotfiles in the way."

    - name: Apply the dotfiles (safe to run every time — a no-op when nothing differs)
      ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.local/bin/chezmoi apply"
      changed_when: chezmoi_state.stdout | length > 0

    # After the dotfiles clone on purpose: that clone already proves the
    # SSH key works, so no second checkpoint is needed here.
    - name: Ensure ~/projects exists
      ansible.builtin.file:
        path: "{{ projects_dir }}"
        state: directory
        mode: "0755"

    - name: Clone project repos (first run only — these are your working repos, left alone after that, not auto-synced)
      ansible.builtin.git:  # noqa: latest[git] — active dev repos, deliberately unpinned
        repo: "{{ item }}"
        dest: "{{ projects_dir }}/{{ item | basename | regex_replace('\\.git$', '') }}"
        version: HEAD
        update: false
      loop: "{{ project_repos }}"

    - name: Ensure ~/.zshrc.local exists (untracked, machine-only escape hatch)
      ansible.builtin.file:
        path: "{{ ansible_facts['env']['HOME'] }}/.zshrc.local"
        state: touch
        mode: "0644"
        access_time: preserve
        modification_time: preserve

- name: Post-run summary
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Print next steps
      ansible.builtin.debug:
        msg:
          - "Done."
          - "Next steps:"
          - "  1. Log out and back in — needed for the docker group to take effect (you'll get 'permission denied' on the docker socket until you do) and for the shell change to fully take. 'exec zsh' reloads the shell alone, but won't pick up the new group."
          - "  2. Run 'p10k configure' to set up the prompt"
          - "  3. Open nvim once to let lazy.nvim install all plugins automatically"
          - "  4. To edit a dotfile going forward: 'chezmoi edit ~/.zshrc' then 'chezmoi apply'"
